<svg xmlns="http://www.w3.org/2000/svg" width="400" height="840" viewBox="0 0 400 840" data-palette="5665e6-a06ae7-accff6-bc60d84407ab" role="img" aria-labelledby="process-mobile-light-title process-mobile-light-desc"><title id="process-mobile-light-title">ClinRec process</title><desc id="process-mobile-light-desc">Regex-path example; no model or clinical validation.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="400" y2="840"><stop stop-color="#5463e2"/><stop offset=".6" stop-color="#8759c3"/><stop offset="1" stop-color="#5f7288"/></linearGradient><radialGradient id="halo"><stop stop-color="#5463e2" stop-opacity=".22"/><stop offset="1" stop-color="#f9fafe" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbd0f7" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#5463e2" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="400" height="840" rx="16" fill="#f9fafe"/><rect width="400" height="840" rx="16" fill="url(#grid)"/><ellipse cx="252.0" cy="361.2" rx="200.0" ry="588.0" fill="url(#halo)"/><text x="28" y="44" fill="#556188" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="28" y="84.0" fill="#131830" font-size="25" text-anchor="start" font-weight="400">Inspect a fictional</text><text x="28" y="119.0" fill="#131830" font-size="25" text-anchor="start" font-weight="400">local example</text><path d="M200 257V290" fill="none" stroke="#5463e2" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 257V290" class="flow" fill="none" stroke="#5f7288" stroke-width="2"/><rect x="28" y="135" width="344" height="122" rx="12" fill="#f7f7fe" stroke="#cbd0f7"/><text x="46" y="166.0" fill="#131830" font-size="21" text-anchor="start" font-weight="400">01  Read three TXT files</text><text x="46" y="218.0" fill="#556188" font-size="17" text-anchor="start" font-weight="400">Includes one normalized</text><text x="46" y="241.8" fill="#556188" font-size="17" text-anchor="start" font-weight="400">duplicate</text><path d="M200 412V445" fill="none" stroke="#5463e2" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 412V445" class="flow" fill="none" stroke="#5f7288" stroke-width="2"/><rect x="28" y="290" width="344" height="122" rx="12" fill="#f7f7fe" stroke="#cbd0f7"/><text x="46" y="321.0" fill="#131830" font-size="21" text-anchor="start" font-weight="400">02  Keep two records</text><text x="46" y="373.0" fill="#556188" font-size="17" text-anchor="start" font-weight="400">Original text retained</text><path d="M200 567V600" fill="none" stroke="#5463e2" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 567V600" class="flow" fill="none" stroke="#5f7288" stroke-width="2"/><rect x="28" y="445" width="344" height="122" rx="12" fill="#f7f7fe" stroke="#cbd0f7"/><text x="46" y="476.0" fill="#131830" font-size="21" text-anchor="start" font-weight="400">03  Assemble locally</text><text x="46" y="528.0" fill="#556188" font-size="17" text-anchor="start" font-weight="400">Rule linker; three events</text><rect x="28" y="600" width="344" height="122" rx="12" fill="#f7f7fe" stroke="#cbd0f7"/><text x="46" y="631.0" fill="#131830" font-size="21" text-anchor="start" font-weight="400">04  Check the chain</text><text x="46" y="683.0" fill="#556188" font-size="17" text-anchor="start" font-weight="400">Thirteen audit entries</text><text x="28" y="775.0" fill="#5f7288" font-size="18" text-anchor="start" font-weight="400">Regex-path example; no model or</text><text x="28" y="800.2" fill="#5f7288" font-size="18" text-anchor="start" font-weight="400">clinical validation.</text></svg>
