<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif"
     role="img" aria-label="ClinRec architecture: faxed records → ingest (OCR+dedup) → resolve (medspaCy NER + on-prem linker) → timeline assemble, with a per-op sha-256 audit chain, PHI never leaves the host">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>
  <!-- title strip -->
  <text x="20" y="32" font-size="14" font-weight="600" fill="#6E6E73">On-prem clinical timeline · no-PHI-egress audit chain</text>
  <text x="860" y="32" text-anchor="end" font-size="12" font-weight="500" fill="#10A37F">PHI never leaves the host</text>

  <!-- static connectors (top flow + audit branches) -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="200" y1="120" x2="230" y2="120" marker-end="url(#ah-l)"/>
    <line x1="410" y1="120" x2="440" y2="120" marker-end="url(#ah-l)"/>
    <line x1="640" y1="120" x2="670" y2="120" marker-end="url(#ah-l)"/>
    <line x1="540" y1="160" x2="540" y2="240" marker-end="url(#ah-l)"/>
    <line x1="765" y1="160" x2="765" y2="240" marker-end="url(#ah-l)"/>
  </g>
  <!-- marching-dash data flow (direction = data direction) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="200" y1="120" x2="226" y2="120" stroke="#0071E3" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="410" y1="120" x2="436" y2="120" stroke="#0071E3" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="640" y1="120" x2="666" y2="120" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="540" y1="160" x2="540" y2="236" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="0" to="32" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="765" y1="160" x2="765" y2="236" stroke="#10A37F" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="0" to="32" dur="1.6s" begin="-1.6s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- data packets along connectors -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M200,120 L226,120" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M410,120 L436,120" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M640,120 L666,120" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M540,160 L540,236" dur="2.6s" begin="-0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" begin="-0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes (top row) -->
  <g>
    <rect x="20"  y="80" width="180" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="110" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">Faxed PDFs / TIFFs</text>
    <text x="110" y="138" text-anchor="middle" font-size="11" fill="#6E6E73">de-identified drop folder</text>

    <rect x="230" y="80" width="180" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="320" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">Ingest</text>
    <text x="320" y="138" text-anchor="middle" font-size="11" fill="#6E6E73">OCR (tesseract) + content-hash dedup</text>

    <rect x="440" y="80" width="200" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="540" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Resolve</text>
    <text x="540" y="138" text-anchor="middle" font-size="11" fill="#6E6E73">medspaCy NER + on-prem Llama 3.1 linker</text>

    <rect x="670" y="80" width="190" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="765" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">Timeline</text>
    <text x="765" y="138" text-anchor="middle" font-size="11" fill="#6E6E73">assemble + de-dup dated events</text>
  </g>

  <!-- audit node (the novel surface) -->
  <g>
    <rect x="440" y="240" width="420" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.6s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="650" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Per-op sha-256 audit chain → audit.jsonl</text>
    <text x="650" y="298" text-anchor="middle" font-size="11" fill="#6E6E73">regulator-reviewable · phi_egress = False (invariant)</text>
  </g>
</svg>
