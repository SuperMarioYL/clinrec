name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist into dist/
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Generate dist checksums
        run: |
          cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # Optional PyPI trusted-publishing — opt-in only. A fresh repo has no Trusted
  # Publisher registered, so an always-on job fails the FIRST release with
  # `invalid-publisher`. Gate it behind the PYPI_PUBLISH repo variable
  # (default unset → job skipped). Register the Trusted Publisher + set the
  # variable when you actually want to ship to PyPI.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/clinrec
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
