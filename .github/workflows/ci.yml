name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tesseract-ocr (for the OCR ingest path)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install clinrec + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test the CLI
        run: |
          clinrec version
          clinrec ingest ./sample-records
          clinrec audit --export /tmp/audit.jsonl
          clinrec eval --gold tests/gold.jsonl
