[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "clinrec"
version = "0.1.0"
description = "On-prem primitive turning faxed and scanned PHI into a regulator-reviewable clinical timeline."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "clinical-nlp",
    "medspacy",
    "ollama",
    "hipaa",
    "entity-resolution",
    "clinical-timeline",
    "on-prem",
    "phi",
    "audit",
    "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "medspacy>=1.0,<2.0",
    "ollama>=0.3,<1.0",
    "pdfplumber>=0.11,<1.0",
    "pytesseract>=0.3,<1.0",
    "pydantic>=2.7,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
clinrec = "clinrec.cli:app"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/clinrec"
Issues = "https://github.com/SuperMarioYL/clinrec/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/clinrec"]

[tool.hatch.build.targets.sdist]
include = ["src/clinrec", "tests", "sample-records", "docs", "assets", "README.md", "README.zh-CN.md", "LICENSE", "VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::SyntaxWarning",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
